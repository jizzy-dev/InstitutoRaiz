{% include 'header_sistema.html' %}
<main class="main-consultar">
    <div class="table-wrapper flex flex-column center">
        <form method="POST" action="?pag=turma&metodo=atribuirTurma">
            <table class="tables tb-matricula">
                <thead>
                    <tr class="tr-titulo">
                        <th>{{titulo}}</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><label for="id_aluno">Aluno:</label></td>
                        <td>
                            <select id="id_aluno" name="id_aluno" class="textbox" required>
                                {% for aluno in alunos %}
                                <option value="{{aluno.ID_ALUNO}}">{{aluno.nome}}</option>
                                {% endfor %}
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="ID_TURMA">Turma:</label></td>
                        <td>
                            <select id="ID_TURMA" name="ID_TURMA" class="textbox" required>
                                {% for turma in turmas %}
                                <option value="{{turma.ID_TURMA}}">{{turma.nome_turma}}</option>
                                {% endfor %}
                            </select>
                        </td>
                    </tr>
                    <tr class="tr-titulo-section tr-submit">
                        <th><button type="submit" class="button btn-form-submit">Atribuir Turma</button></th>
                    </tr>
                </tbody>
            </table>
        </form>
    </div>
</main>
